e    Puroland Illumination Christmas runs from Friday, November 6 to Friday, December 25, 2026. Hours vary by day. In November and December the park opens between 8:30 and 9:30 a.m. and closes at 5 or 6 p.m. It's closed on November 24, 25 and 26 and December 3, 9 and 10, so check the official calendar before you go.    Tickets 2026    Prices change by date. During the event, adults (18 to 64) pay  to , and children aged 3 to 17 and seniors pay  to . Under-3s get in free. Tuesday, December 1 is the cheapest day, and the November 21 to 23 holiday weekend is the most expensive. An Afternoon Passport (entry from 2 p.m.) starts at  for adults and still catches the closing dance.    Tickets are dated, and every visit needs a reservation. You can book tickets for Sanrio Puroland online in English, or buy the e-passport on the official site, which includes the reservation and can be canceled up to the day before. Without a reservation, you'll be turned away at the ticket window.    How to get there    Sanrio Puroland is a short walk from Tama Center Station on the Kei\u014d, Odaky\u016b and Tama Monorail lines, about 30 minutes from Shinjuku by Kei\u014d Line limited express. Leave by the Kei\u014d central gate or the Odaky\u016b west gate and follow the pedestrian promenade.    For more Sanrio, see our page on Puroland's Halloween event, or Christmas at Tokyo Skytree for another festive day out.  ","articleSection":"","wordCount":373,"audience":{"@type":"Audience","audienceType":"everyone","geographicArea":{"@type":"AdministrativeArea","name":"Tokyo","address":{"@type":"PostalAddress","addressCountry":"Japan","addressRegion":"Kant\u014d region","addressLocality":"Tokyo"},"sameAs":["https:\/\/en.wikipedia.org\/wiki\/Tokyo"]}},"author":{"@context":"https:\/\/schema.org","@type":"Person","name":"TC Team","url":"https:\/\/tokyocheapo.com\/author\/tcteam\/","sameAs":[]},"contentLocation":[{"@type":"Place","name":"Tama","address":{"@type":"PostalAddress","addressCountry":"Japan"
