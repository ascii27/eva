body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--surface-000)}
a{color:var(--accent)}a:hover{color:var(--ink)}
.wb-event{transition:transform .12s ease,box-shadow .24s ease;-webkit-tap-highlight-color:transparent}
.wb-event:active{transform:scale(.97)}
.wb-event.is-party{box-shadow:0 0 0 3px var(--warm),var(--elevation-1)}
.wb-lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .35s cubic-bezier(.3,.7,.2,1.4)}
.wb-event.is-party .wb-lid{transform:translate(-1px,-4px) rotate(-18deg)}
.wb-event.is-party .wb-gift{animation:wb-wiggle .6s ease}

@keyframes wb-burst{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}55%{opacity:1;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(calc(var(--r) * .6))}100%{opacity:0;transform:translate(calc(-50% + var(--dx2)),calc(-50% + var(--dy2))) rotate(var(--r))}}
.wb-party-text{animation:wb-in .3s ease-out}
@keyframes wb-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wb-bit{display:none}.wb-event.is-party .wb-gift{animation:none}.wb-lid{transition:none}}
.wb-balloon{position:absolute;left:50%;top:30%;opacity:0;animation:wb-rise 3s cubic-bezier(.25,.6,.35,1) forwards;pointer-events:none}
.wb-balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:34px;background:rgba(29,23,18,.35)}
@keyframes wb-rise{0%{opacity:0;transform:translate(-50%,10px) scale(.4)}12%{opacity:1;transform:translate(calc(-50% + var(--x0)),-30px) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--x1)),var(--y1)) rotate(var(--r))}}
.wb-flake{position:absolute;left:50%;top:50%;opacity:0;animation:wb-fall 2.8s linear forwards;pointer-events:none;color:#3a6fc0}
@keyframes wb-fall{0%{opacity:0;transform:translate(calc(-50% + var(--x0)),-340px) rotate(0)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x1)),30px) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.wb-balloon,.wb-flake{display:none}}
</style>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":760}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._p); }
  celebrate(k) {
    clearTimeout(this._p);
    this.setState({ party: null }, () => this.setState({ party: k }));
    this._p = setTimeout(() => this.setState({ party: null }), 4000);
  }
  renderVals() {
    const p = this.state && this.state.party;
    const t = {};
    ['gift', 'cake', 'snow'].forEach((k) => { t[k] = { on: p === k, off: p !== k, cls: p === k ? 'is-party' : '', tap: () => this.celebrate(k) }; });
    return { t: t };
  }
}
</script>
