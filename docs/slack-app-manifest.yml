# Slack app manifest for the Eva Companion device (Phase 3).
# Apply at api.slack.com/apps → Create New App → From an app manifest.
# After install: copy the Bot User OAuth Token (xoxb-…), then generate an
# App-Level Token with connections:write (xapp-…). Both are entered on the
# device via the dev overlay's SLACK → Pair form — never committed here.
display_information:
  name: Eva Companion
  description: Voice bridge for the Eva desk device.
features:
  bot_user:
    display_name: eva-companion
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history # read #eva-direct (public)
      - channels:read
      - groups:history # in case #eva-direct is ever made private
      - groups:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
